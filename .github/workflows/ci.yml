name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  infra:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:infra
      - run: pnpm test:infra

  audit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
      - run: make GO=go GOFMT=gofmt check
      - run: make GO=go GOFMT=gofmt coverage

  containers:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        component: [edge, connector, cli]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: false
          load: true
          tags: tailbridge-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true
      - name: Run the CLI smoke test
        if: matrix.component == 'cli'
        run: docker run --rm tailbridge-cli:ci version
      - name: Confirm the unprivileged image user
        if: matrix.component != 'edge'
        run: test "$(docker image inspect --format '{{.Config.User}}' tailbridge-${{ matrix.component }}:ci)" = "nonroot:nonroot"
      - name: Run the service smoke test
        if: matrix.component != 'cli'
        run: |
          set +e
          docker run --rm tailbridge-${{ matrix.component }}:ci
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
