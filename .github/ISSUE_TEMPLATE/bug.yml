name: Bug report
description: Report a reproducible Tailbridge defect.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, certificates, or packet payloads.
  - type: input
    id: version
    attributes:
      label: Version or image digest
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the edge provider, Railway region, client platform, and Tailscale version.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
