server {
    listen [::]:__PORT__ ipv6only=off;
    server_name _;

    access_log off;
    sendfile on;
    tcp_nopush on;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ready\n";
    }

    location = /ping {
        add_header Cache-Control "no-store";
        return 204;
    }

    location = /download {
        alias /tmp/tailbridge-performance-payload.bin;
        default_type application/octet-stream;
    }
}
