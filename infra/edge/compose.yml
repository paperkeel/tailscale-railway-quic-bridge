services:
  edge:
    image: {{EDGE_IMAGE}}
    env_file:
      - edge.env
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /var/lib/tailbridge/tailscale:/var/lib/tailscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/tailscale
